name: Build and publish Musike
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build.yml'
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: musike-build
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout deployment repository
        uses: actions/checkout@v4
      - name: Checkout current upstream default branch
        uses: actions/checkout@v4
        with:
          repository: Ernani1234/musike
          path: upstream
          persist-credentials: false
      - name: Resolve upstream revision
        id: upstream
        shell: bash
        run: |
          SHA=$(git -C upstream rev-parse HEAD)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"
          echo "Upstream revision: $SHA" >> "$GITHUB_STEP_SUMMARY"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push current upstream
        uses: docker/build-push-action@v6
        with:
          context: ./upstream
          file: ./upstream/Dockerfile
          platforms: linux/amd64,linux/arm64
          pull: true
          no-cache: true
          push: true
          tags: |
            ghcr.io/jbkunama1/hai.musike:latest
            ghcr.io/jbkunama1/hai.musike:upstream-${{ steps.upstream.outputs.sha }}
            ghcr.io/jbkunama1/hai.musike:build-${{ steps.upstream.outputs.date }}-${{ github.run_number }}
          labels: |
            org.opencontainers.image.title=hAI.Musike
            org.opencontainers.image.source=https://github.com/jbkunama1/hAI.Musike
            org.opencontainers.image.revision=${{ steps.upstream.outputs.sha }}
            org.opencontainers.image.description=Musike upstream source build for highfishNetwork
